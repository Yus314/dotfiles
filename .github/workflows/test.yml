name: build and cache
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/setup-nix/**'
      - '.github/workflows/test.yml'
      - 'applications/**'
      - 'flake-module.nix'
      - 'flake.lock'
      - 'flake.nix'
      - 'homes/**'
      - 'infra/**'
      - 'lib/**'
      - 'Makefile'
      - 'modules/**'
      - 'overlays/**'
      - 'pkgs/**'
      - 'systems/**'
  push:
    branches:
      - main
    paths:
      - '.github/actions/setup-nix/**'
      - '.github/workflows/test.yml'
      - 'applications/**'
      - 'flake-module.nix'
      - 'flake.lock'
      - 'flake.nix'
      - 'homes/**'
      - 'infra/**'
      - 'lib/**'
      - 'Makefile'
      - 'modules/**'
      - 'overlays/**'
      - 'pkgs/**'
      - 'systems/**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check flake
        run: nix flake check --no-build --all-systems --keep-going --allow-import-from-derivation
  build:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Free disk space
        if: matrix.os == 'macos-14'
        run: |
          active_xcode="$(xcode-select -p)"
          active_xcode="${active_xcode%/Contents/Developer}"
          for xcode in /Applications/Xcode*.app; do
            if [ -d "$xcode" ] && [ "$xcode" != "$active_xcode" ]; then
              sudo rm -rf "$xcode"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          df -h
      # workaround for "No space left on device"
      - name: Collect garbage
        if: matrix.os == 'ubuntu-latest'
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          build-mount-path: "/nix"
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Prepare Nix build directory
        if: matrix.os == 'ubuntu-latest'
        run: sudo install -d -m 1777 /nix/tmp
      - name: Create /run for darwin
        if: matrix.os == 'macos-14'
        run: |
          printf "run\tprivate/var/run\n" | sudo tee -a /etc/synthetic.conf
          /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -t || true
      - name: build
        env:
          NIX: nix
          NIX_CONFIG: ${{ matrix.os == 'ubuntu-latest' && 'build-dir = /nix/tmp' || 'max-jobs = 1' }}
        run: |-
          make build
          df -h
